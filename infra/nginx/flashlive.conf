# FILE: infra/nginx/flashlive.conf
# PURPOSE: Nginx configuration for FLASHLIVE static hosting and API proxying.
# WHY: Serves the React SPA, proxies API/socket traffic and exposes deployment
# artifacts under /sites/<deployment-id>/.
# HOW: SPA fallback for client routes, proxy_pass for /api and /socket.io,
# and alias for immutable artifact directories.
# USED BY: infra/docker/web.Dockerfile and production Nginx.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /sites/ {
    alias /usr/share/nginx/artifacts/;
    autoindex off;
    try_files $uri $uri/index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
